name: pilot-loopback-request-verification
on:
  pull_request:
    branches:
      - pilot/render-free-gateway
    paths:
      - 'backend/dataplane/gateway-dp-app/src/test/java/io/reliabilityai/gateway/dataplane/app/ingress/HttpEndToEndTest.java'
      - '.github/workflows/pilot-request-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify entire HTTP to pipeline to loopback provider test suite
        run: mvn -B -ntp -f backend/pom.xml -pl :gateway-dp-app -am test -Dtest=HttpEndToEndTest -Dsurefire.failIfNoSpecifiedTests=false
