name: pilot-full-reactor-verification
on:
  pull_request:
    branches:
      - pilot/render-free-gateway
    paths:
      - '.github/workflows/pilot-full-reactor-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-reactor-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full backend reactor (tests and quality gates)
        run: mvn -B -ntp -f backend/pom.xml verify
